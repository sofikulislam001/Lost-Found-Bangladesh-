<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexFly IT – সব ডিজিটাল সার্ভিস, এক জায়গায়</title>
<meta name="description" content="NexFly IT: গেম টপআপ, ফেসবুক গাইড, ডিজাইন ও এডিটিং, ওয়েব ও অ্যাপ – সব ডিজিটাল সার্ভিস এক জায়গায়।">
<meta name="theme-color" content="#0a0720">
<meta property="og:title" content="NexFly IT"><meta property="og:description" content="সব ডিজিটাল সার্ভিস, এক জায়গায়"><meta property="og:image" content="img/og.jpg">
<link rel="icon" href="img/logo.webp"><link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070511;--card:rgba(23,16,45,.78);--line:rgba(177,112,255,.22);--p:#7B2CFF;--p2:#A64DFF;--cy:#14D8FF;--tx:#F7F2FF;--mut:#A99DBD;--ok:#21D07A;--warn:#FFB020;--bad:#FF5577;--gold:#fbbf24}
body.light{--bg:#f3f0ff;--card:rgba(255,255,255,.88);--line:rgba(124,58,237,.2);--tx:#1a1240;--mut:#5b5490}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:76px;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.45;animation:drift 18s ease-in-out infinite alternate}
body::before{background:radial-gradient(circle,#7c3aed,transparent 65%);top:-25vmax;left:-15vmax}
body::after{background:radial-gradient(circle,#0ea5e9,transparent 65%);bottom:-30vmax;right:-20vmax;animation-delay:-6s;opacity:.25}
body.light::before,body.light::after{opacity:.18}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.1)}}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input,select,textarea{font-family:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font-size:15px;outline:none;transition:.2s}
body.light input,body.light select,body.light textarea{background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(168,85,247,.22)}
select option{color:#111}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:600;font-size:15px;background:linear-gradient(100deg,var(--p),var(--p2));color:#fff;box-shadow:0 8px 24px rgba(124,58,237,.4);transition:.25s;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:.6s}
.btn:hover::after{transform:translateX(120%)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(124,58,237,.55)}
.btn:disabled{opacity:.6;pointer-events:none}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--tx)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn.ok{background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:none}
.btn.bad{background:linear-gradient(135deg,#dc2626,#ef4444);box-shadow:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px)}
.ann{background:linear-gradient(90deg,var(--p),#0ea5e9);color:#fff;font-size:13px;font-weight:500;overflow:hidden;white-space:nowrap;padding:7px 0}
.ann span{display:inline-block;padding-left:100%;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
header{position:sticky;top:0;z-index:50;background:rgba(7,4,26,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
body.light header{background:rgba(255,255,255,.85)}
.nav{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:Poppins;font-weight:800;font-size:22px}
.logo img{border-radius:10px;box-shadow:0 0 18px rgba(168,85,247,.6)}
.logo i{font-style:italic;background:linear-gradient(90deg,var(--p2),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-family:'Hind Siliguri';font-size:10px;font-weight:400;color:var(--mut);margin-top:-4px}
.links{display:flex;gap:4px;align-items:center}
.links a{padding:8px 14px;border-radius:10px;font-weight:500;color:var(--mut);transition:.2s}
.links a.on,.links a:hover{background:rgba(124,58,237,.25);color:var(--tx)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:40px 0 18px}
.badge{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:rgba(255,255,255,.06)}
.hero h1{font-family:Poppins;font-size:clamp(42px,7vw,72px);font-weight:800;margin:14px 0 6px;line-height:1.05}
.hero h1 i{background:linear-gradient(90deg,var(--p2),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .tag{font-size:clamp(20px,3.2vw,30px);font-weight:700;color:var(--cy);margin-bottom:8px}
.hero p{color:var(--mut);margin-bottom:18px}
.search{display:flex;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.08);max-width:540px;position:relative}
.search input{border:0;background:transparent;border-radius:0}
.search button{padding:0 22px;background:linear-gradient(100deg,var(--p),var(--p2));font-weight:600;color:#fff}
.sug{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-top:6px;z-index:20;overflow:hidden}
.sug a{display:block;padding:10px 14px}.sug a:hover{background:rgba(124,58,237,.25)}
.heroimg{display:flex;justify-content:center;position:relative}
.heroimg img{width:100%;max-width:440px;border-radius:28px;box-shadow:0 20px 70px rgba(124,58,237,.6);animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}
.kpis{display:flex;gap:22px;margin-top:20px;flex-wrap:wrap}
.kpis div b{display:block;font-family:Poppins;font-size:24px;color:var(--tx)}
.kpis div small{color:var(--mut)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
.cat{padding:16px 8px;text-align:center;border-radius:16px;cursor:pointer;transition:.25s;font-weight:500;font-size:14px}
.cat:hover,.cat.on{border-color:var(--p2);transform:translateY(-4px);background:rgba(124,58,237,.3);box-shadow:0 10px 30px rgba(124,58,237,.3)}
.cat b{display:block;font-size:30px;margin-bottom:4px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;margin:14px 0}
.strip div{display:flex;gap:12px;align-items:center;justify-content:center;font-size:14px}
.strip span{font-size:28px}
.strip small{display:block;color:var(--mut)}
h2.t{font-size:22px;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}
h2.t small{font-size:13px;color:var(--p2);font-weight:500}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.svc{padding:12px;overflow:hidden;position:relative;transition:.3s}
.svc:hover{transform:translateY(-6px);border-color:var(--p2);box-shadow:0 16px 40px rgba(124,58,237,.35)}
.svc .im{height:110px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:46px;margin-bottom:10px;overflow:hidden}
.svc .im img{width:100%;height:100%;object-fit:cover;transition:.5s}
.svc:hover .im img{transform:scale(1.08)}
.svc h3{font-size:16px;margin-bottom:2px}
.svc p{font-size:13px;color:var(--mut);margin-bottom:10px;min-height:36px}
.svc .pr{color:var(--cy);font-weight:700;margin-bottom:8px}
.svc .btn{width:100%}
.tagp{position:absolute;top:18px;left:18px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;z-index:2}
.heart{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.45);font-size:16px;z-index:2;display:flex;align-items:center;justify-content:center}
.heart.on{background:rgba(239,68,68,.85)}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px}
.offer{padding:24px;background:linear-gradient(135deg,rgba(124,58,237,.6),rgba(14,165,233,.25));display:flex;flex-direction:column;justify-content:center;gap:10px}
.offer h3{font-size:30px;line-height:1.1}
.cpn{display:inline-flex;gap:8px;align-items:center;background:rgba(0,0,0,.35);border:1px dashed var(--cy);padding:8px 14px;border-radius:10px;width:fit-content;font-weight:700;color:var(--cy);cursor:pointer}
.why,.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.why .card,.how .card{padding:18px;text-align:center}
.why span,.how span{font-size:30px}
.how .n{width:34px;height:34px;border-radius:50%;background:linear-gradient(100deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 8px}
.why b,.how b{display:block;margin:4px 0}
.why small,.how small{color:var(--mut)}
.rvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rv{padding:14px}.rv p{margin:6px 0;font-size:14px}.rv small{color:var(--mut)}
details.fq{padding:14px 16px;margin-bottom:10px}
details.fq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.fq summary::after{content:"＋";color:var(--p2)}
details[open].fq summary::after{content:"－"}
details.fq p{color:var(--mut);margin-top:8px;font-size:14px}
footer{margin-top:40px;border-top:1px solid var(--line);padding:28px 0;background:rgba(0,0,0,.18)}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:20px;font-size:14px;color:var(--mut)}
.fg h4{color:var(--tx);margin-bottom:8px}
.fg a{display:block;margin:4px 0}.fg a:hover{color:var(--p2)}
.pays{display:flex;gap:8px;flex-wrap:wrap}
.pay{padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:#fff}
.bk{background:#e2136e}.ng{background:#f6921e}.rk{background:#8c3494}
.copy{text-align:center;color:var(--mut);font-size:13px;margin-top:20px}
.pg{padding:24px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{padding:18px}.box h3{margin-bottom:10px}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:10px 0}
.pk button{padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:600;transition:.2s}
.pk button small{display:block;color:var(--cy);font-size:14px}
.pk button:hover{border-color:var(--p2)}
.pk button.on{border-color:var(--p2);background:rgba(124,58,237,.4);box-shadow:0 0 0 2px rgba(168,85,247,.3)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.ticks{display:flex;flex-direction:column;gap:6px;color:var(--mut);font-size:14px;margin:10px 0}
.ticks span::before{content:"✔ ";color:var(--ok)}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.methods button{padding:14px;border-radius:12px;border:2px solid transparent;color:#fff;font-weight:700;opacity:.65;transition:.2s}
.methods button.on{border-color:#fff;opacity:1;transform:scale(1.03)}
.row{display:flex;gap:8px}
.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.step{display:flex;gap:12px;align-items:flex-start;margin:14px 0;position:relative}
.dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(255,255,255,.1);flex:none}
.dot.d{background:var(--ok)}.dot.x{background:var(--bad)}
.ol{padding:14px;margin-bottom:10px;transition:.2s}.ol:hover{border-color:var(--p2)}
.st{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.st.pending{background:rgba(245,158,11,.2);color:var(--warn)}
.st.processing{background:rgba(34,211,238,.2);color:var(--cy)}
.st.completed{background:rgba(34,197,94,.2);color:var(--ok)}
.st.rejected{background:rgba(239,68,68,.2);color:var(--bad)}
.adm{display:grid;grid-template-columns:220px 1fr;gap:16px}
.side{padding:12px;height:fit-content;position:sticky;top:80px}
.side button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;background:transparent;color:var(--mut);font-weight:500;margin:2px 0}
.side button.on{background:rgba(124,58,237,.35);color:var(--tx)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{padding:16px}.stat small{color:var(--mut)}.stat b{display:block;font-size:26px;margin-top:4px;font-family:Poppins}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500}
.tw{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;margin-top:10px}
.bars div{flex:1;background:linear-gradient(to top,var(--p),var(--cy));border-radius:6px 6px 0 0;position:relative;min-height:4px}
.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.hbar{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--cy));margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05);white-space:nowrap;font-weight:500;font-size:14px}
.chip.on{background:linear-gradient(100deg,var(--p),var(--p2));border-color:transparent;color:#fff}
.hint{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,.06);font-weight:600}
.tabs button.on{background:linear-gradient(100deg,var(--p),var(--p2));color:#fff}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.14),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px;height:210px}
@keyframes sh{to{background-position:-200% 0}}
.rv0{opacity:0;transform:translateY(18px);transition:.6s}
.rv0.in{opacity:1;transform:none}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1e1b4b;border:1px solid var(--p2);color:#fff;padding:12px 20px;border-radius:12px;z-index:99;display:none;max-width:90vw;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.fab{position:fixed;right:14px;bottom:86px;z-index:70;display:flex;flex-direction:column;gap:10px}
.fab a,.fab button{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fab .wa{background:#25d366;color:#fff}.fab .up{background:var(--p);color:#fff;display:none}
.bn{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(7,4,26,.95);border-top:1px solid var(--line);z-index:60;padding:6px 0 8px;backdrop-filter:blur(12px)}
body.light .bn{background:rgba(255,255,255,.96)}
.bn a{flex:1;text-align:center;font-size:11px;color:var(--mut);padding:4px}
.bn a b{display:block;font-size:20px}.bn a.on{color:var(--p2)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.ok-ban{text-align:center;padding:26px}.ok-ban .big{font-size:56px}
@media(max-width:860px){
 .links{display:none}.bn{display:flex}
 .hero,.split,.two,.adm,.fg{grid-template-columns:1fr}
 .heroimg{order:-1}.heroimg img{max-width:340px}
 .cats{grid-template-columns:repeat(2,1fr)}
 .strip,.why,.how{grid-template-columns:1fr}
 .stats{grid-template-columns:repeat(2,1fr)}
 .side{display:flex;overflow-x:auto;gap:4px;position:static}.side button{white-space:nowrap;width:auto}
 .grid{grid-template-columns:repeat(2,1fr)}
 .logo small{display:none}
}

.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
.stage{position:relative;width:min(460px,92vw);aspect-ratio:1/1;margin:0 auto}
.stage .core{position:absolute;left:50%;top:50%;width:46%;transform:translate(-50%,-52%);mix-blend-mode:screen;filter:drop-shadow(0 0 40px rgba(166,77,255,.9));animation:fl 6s ease-in-out infinite;z-index:3}
.stage .ring{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid rgba(166,77,255,.55);box-shadow:0 0 30px rgba(123,44,255,.5),inset 0 0 30px rgba(123,44,255,.3);transform:translate(-50%,-50%) rotateX(68deg)}
.stage .r1{width:92%;height:92%;animation:spin 18s linear infinite}
.stage .r2{width:66%;height:66%;border-color:rgba(20,216,255,.5);animation:spin 12s linear infinite reverse}
@keyframes spin{to{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(360deg)}}
.stage .fl{position:absolute;width:22%;mix-blend-mode:screen;animation:fl 5s ease-in-out infinite;z-index:4}
.stage .f1{left:4%;top:6%}.stage .f2{right:2%;top:4%;animation-delay:-1s}.stage .f3{left:0;top:40%;animation-delay:-2s}.stage .f4{right:0;top:42%;animation-delay:-3s}.stage .f5{left:12%;bottom:6%;animation-delay:-1.5s}.stage .f6{right:10%;bottom:4%;animation-delay:-2.5s}
.ci{width:64px;height:64px;object-fit:contain;mix-blend-mode:screen;margin:0 auto 4px;display:block}
.cat b{font-size:15px!important;margin:0!important}.cat small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.im.art{background:radial-gradient(circle at 50% 60%,#2a1459,#0d0920 75%)!important}
.im.art img{object-fit:contain;mix-blend-mode:screen;padding:6px}
.tstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 16px;margin:14px 0}
.tstrip div{display:flex;gap:10px;align-items:center;font-size:14px}
.tstrip img{width:40px;height:40px;object-fit:contain;mix-blend-mode:screen}
.tstrip small{display:block;color:var(--mut);font-size:12px}
.offer{position:relative;overflow:hidden}
.offer .gift{position:absolute;right:-10px;bottom:-10px;width:44%;mix-blend-mode:screen;animation:fl 5s ease-in-out infinite;pointer-events:none}
.heroctas{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stepper{display:flex;gap:8px;margin-bottom:14px;font-size:13px}
.stepper div{flex:1;text-align:center;padding:8px;border-radius:10px;background:rgba(255,255,255,.06);color:var(--mut)}
.stepper div.on{background:linear-gradient(100deg,var(--p),var(--p2));color:#fff;font-weight:600}
.crumb{font-size:13px;color:var(--mut);margin-bottom:10px}.crumb a{color:var(--p2)}
.authlogo{display:block;margin:0 auto 10px;width:72px;height:72px;border-radius:18px;box-shadow:0 0 30px rgba(166,77,255,.6)}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;color:var(--mut);padding:6px}
.side button .ic{margin-right:8px}
.bn a .ic{width:22px;height:22px;display:block;margin:0 auto 2px}
.pill{display:inline-flex;gap:6px;align-items:center}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#app>*{animation:pgin .25s ease-out}@keyframes pgin{from{opacity:0;transform:translateY(10px)}}
@media(max-width:860px){.tstrip{grid-template-columns:repeat(2,1fr)}.stage{width:min(340px,88vw)}}

.bnr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;margin:14px 0;background:linear-gradient(100deg,rgba(123,44,255,.55),rgba(20,216,255,.2));overflow:hidden}
.bnr b{font-size:20px}.bnr p{color:var(--mut);margin:4px 0 10px}.bnr img{height:90px;object-fit:contain;border-radius:12px}

async function upImg(file,slug){
 const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${slug}-${Date.now()}.${ext}`;
 const {error}=await sb.storage.from('nx-images').upload(path,file,{contentType:file.type});if(error){toast('আপলোড ব্যর্থ: '+error.message);return null}
 return sb.storage.from('nx-images').getPublicUrl(path).data.publicUrl;
}
