 document.querySelectorAll('.cat').forEach(e=>e.onclick=()=>{state.cat=state.cat===e.dataset.c?null:e.dataset.c;state.fav=0;if(r==='home')location.hash='services';else route()});
 document.querySelectorAll('[data-ch]').forEach(e=>e.onclick=()=>{state.cat=e.dataset.ch||null;state.fav=0;route()});
 document.querySelectorAll('[data-fav]').forEach(e=>e.onclick=()=>{state.fav=state.fav?0:1;state.cat=null;route()});
 document.querySelectorAll('[data-w]').forEach(e=>e.onclick=ev=>{ev.preventDefault();const s=e.dataset.w;WISH=WISH.includes(s)?WISH.filter(x=>x!==s):[...WISH,s];lss('nx_wish',WISH);e.classList.toggle('on');e.textContent=WISH.includes(s)?'❤':'🤍'});
 const so=$('#so');if(so)so.onchange=()=>{state.sort=so.value;route()};
 const q=$('#q');if(q){const go=()=>{state.q=q.value;state.cat=null;if(r==='home')location.hash='services';else route()};$('#qb').onclick=go;q.onkeydown=e=>{if(e.key==='Enter')go()};
  const sg=$('#sug');if(sg)q.oninput=()=>{const v=q.value.trim().toLowerCase();if(!v){sg.style.display='none';return}const m=S.filter(s=>s.active&&s.name.toLowerCase().includes(v)).slice(0,5);sg.innerHTML=m.map(s=>`<a href="#svc-${esc(s.slug)}">${esc(s.icon||'')} ${esc(s.name)}</a>`).join('');sg.style.display=m.length?'block':'none'}}
 const cpc=$('#cpc');if(cpc)cpc.onclick=()=>{try{navigator.clipboard.writeText(CFG.coupon);toast('কুপন কপি হয়েছে')}catch(e){toast('কুপন: '+CFG.coupon)}};
 if(r==='svc'){const s=S.find(x=>x.slug===arg);document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{state.pkg=+b.dataset.p;route()});
  const f=$('#of');if(f)f.onsubmit=e=>{e.preventDefault();const p=s.packages[state.pkg]||s.packages[0];const fd=new FormData(f);window.CART={id:s.id,name:s.name,pkg:p[0],price:p[1],data:s.fields.map((x,i)=>x.k+': '+(fd.get('f'+i)||''))};state.coupon=0;if(!user){toast('অর্ডার করতে আগে লগইন করুন');window.AFTER='checkout';location.hash='login'}else location.hash='checkout'}}
 if(r==='checkout'){if(!user){window.AFTER='checkout';location.hash='login';return}
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{state.method=b.dataset.m;route()});
  $('#cpy').onclick=()=>{try{navigator.clipboard.writeText(CFG.pay_number);toast('কপি হয়েছে')}catch(e){toast('নম্বর: '+CFG.pay_number)}};
  $('#ap').onclick=()=>{if($('#cp').value.trim().toUpperCase()===CFG.coupon.toUpperCase()){state.coupon=1;toast('কুপন প্রযোজ্য হয়েছে');route()}else toast('কুপন সঠিক নয়')};
  $('#cf').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;const c=window.CART;const fd=new FormData(e.target);const disc=state.coupon?Math.round(c.price*(+CFG.discount)/100):0;
   const {data,error}=await sb.from('nx_orders').insert({user_id:user.id,service_id:c.id,service_name:c.name,package_name:c.pkg,price:c.price,discount:disc,total:c.price-disc,form_data:c.data,method:state.method,sender_phone:fd.get('ph'),trx_id:fd.get('trx')}).select().single();
   if(error){toast(error.message);btn.disabled=false;return}window.CART=null;state.coupon=0;window.FRESH=data.code;location.hash='track-'+data.code}}
 if(r==='support'){const tf=$('#tf');if(tf)tf.onsubmit=async e=>{e.preventDefault();if(!user){toast('টিকেট পাঠাতে লগইন করুন');window.AFTER='support';location.hash='login';return}const {error}=await sb.from('nx_tickets').insert({user_id:user.id,message:new FormData(e.target).get('m')});if(error)toast(error.message);else{toast('টিকেট জমা হয়েছে');route()}}}
 if(r==='login'){document.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.md;route()});
  const lo=$('#lo');if(lo)lo.onclick=async()=>{await sb.auth.signOut();toast('লগআউট হয়েছে');location.hash='home'};
  const pf=$('#pf');if(pf)pf.onsubmit=async e=>{e.preventDefault();const f=new FormData(pf);const {error}=await sb.from('nx_profiles').update({name:f.get('name'),phone:f.get('phone')}).eq('id',user.id);if(error)toast(error.message);else{toast('প্রোফাইল সেভ হয়েছে');await loadUser();route()}};
  const fp=$('#fp');if(fp)fp.onclick=async e=>{e.preventDefault();const em=prompt('আপনার ইমেইল দিন:');if(!em)return;const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin});toast(error?error.message:'রিসেট লিংক ইমেইলে পাঠানো হয়েছে')};
  const af=$('#af');if(af)af.onsubmit=async e=>{e.preventDefault();const f=new FormData(af);const btn=af.querySelector('button');btn.disabled=true;
   if(state.mode==='up'){const {data,error}=await sb.auth.signUp({email:f.get('email'),password:f.get('pw'),options:{data:{name:f.get('name'),phone:f.get('phone')}}});btn.disabled=false;
    if(error){toast(error.message);return}if(!data.session){toast('ইমেইলে কনফার্মেশন লিংক পাঠানো হয়েছে, কনফার্ম করে লগইন করুন');state.mode='in';route();return}}
   else{const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('pw')});btn.disabled=false;if(error){toast('ইমেইল বা পাসওয়ার্ড ভুল');return}}}}
}
$('#theme').onclick=()=>{document.body.classList.toggle('light');$('#theme').textContent=document.body.classList.contains('light')?'☀️':'🌙'};
$('#up').onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('scroll',()=>{$('#up').style.display=scrollY>500?'flex':'none'},{passive:true});
addEventListener('hashchange',route);
sb.auth.onAuthStateChange((ev,sess)=>{setTimeout(async()=>{await loadUser();if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'){if(window.AFTER&&user){const a=window.AFTER;window.AFTER=null;location.hash=a}else if(ev==='SIGNED_IN'&&location.hash==='#login')location.hash='home';else route()}},0)});
(async()=>{try{await loadData();await loadUser()}catch(e){console.error(e)}route()})();
</script>
</body>
</html>
